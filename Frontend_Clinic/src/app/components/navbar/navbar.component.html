<header class="navbar-header">
  <div class="container navbar-container">
    <!-- Clinic Brand & Logo -->
    <a routerLink="/" class="navbar-brand" (click)="closeMobileMenu()">
      <div class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
          <path d="M12 5v6"/>
          <path d="M9 8h6"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">Al-Amal Clinic</span>
        <span class="brand-subtitle">Appointment Management System</span>
      </div>
    </a>

    <!-- Mobile Hamburger Toggle -->
    <button class="mobile-toggle" (click)="toggleMobileMenu()" aria-label="Toggle navigation">
      <span class="bar" [class.open]="isMobileMenuOpen"></span>
      <span class="bar" [class.open]="isMobileMenuOpen"></span>
      <span class="bar" [class.open]="isMobileMenuOpen"></span>
    </button>

    <!-- Navigation Menu -->
    <nav class="nav-menu" [class.active]="isMobileMenuOpen">
      <ul class="nav-links">
        <li>
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()">Home</a>
        </li>
        <li>
          <a routerLink="/doctors" routerLinkActive="active" (click)="closeMobileMenu()">Doctors</a>
        </li>
        <li>
          <a routerLink="/book" routerLinkActive="active" (click)="closeMobileMenu()">Book Appointment</a>
        </li>
        <li>
          <a routerLink="/appointments" routerLinkActive="active" (click)="closeMobileMenu()">My Appointments</a>
        </li>
        <li>
          <a routerLink="/register-patient" routerLinkActive="active" (click)="closeMobileMenu()">Patient Register</a>
        </li>
        
        <!-- Admin Links -->
        @if (authService.isAuthenticated()) {
          <li class="admin-dropdown-item">
            <a routerLink="/admin/dashboard" routerLinkActive="active" class="admin-link-badge" (click)="closeMobileMenu()">
              <span class="admin-tag">Admin</span> Dashboard
            </a>
          </li>
          <li>
            <button class="btn-logout" (click)="logout()">Logout</button>
          </li>
        } @else {
          <li>
            <a routerLink="/admin/login" routerLinkActive="active" class="btn-admin-login" (click)="closeMobileMenu()">
              Admin Portal
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>
</header>
